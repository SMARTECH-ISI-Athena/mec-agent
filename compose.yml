name: mec-breakout-agent

x-agent-common: &agent-common
  build: .
  image: mec-breakout-agent:latest
  restart: unless-stopped
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  environment:
    PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://back-6gbricks.dedyn.io}
    AGENT_TOKEN: ${AGENT_TOKEN:-}
    POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
    TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
    N9_CIDR: ${N9_CIDR:-172.32.0.0/24}
    N6_CIDR: ${N6_CIDR:-172.31.0.0/24}
    N9_INTERFACE: ${N9_INTERFACE:-}
    N6_INTERFACE: ${N6_INTERFACE:-}
    COUNTER_BACKEND: ${COUNTER_BACKEND:-auto}
    UPF_E_N9_FILTER_CIDR: ${UPF_E_N9_FILTER_CIDR:-}
    EDGE_DN_FILTER_CIDR: ${EDGE_DN_FILTER_CIDR:-}
    CENTRAL_DN_FILTER_CIDR: ${CENTRAL_DN_FILTER_CIDR:-}
    TRAFFIC_URL: ${TRAFFIC_URL:-}
    LATENCY_PROBE_SCOPE: ${LATENCY_PROBE_SCOPE:-auto}

services:
  mec-agent-cn:
    <<: *agent-common
    container_name: mec-breakout-agent-cn
    profiles:
      - upf-cn
    environment:
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://back-6gbricks.dedyn.io}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      N9_CIDR: ${N9_CIDR:-172.32.0.0/24}
      N6_CIDR: ${N6_CIDR:-172.31.0.0/24}
      N9_INTERFACE: ${N9_INTERFACE:-}
      N6_INTERFACE: ${N6_INTERFACE:-}
      COUNTER_BACKEND: ${COUNTER_BACKEND:-auto}
      UPF_E_N9_FILTER_CIDR: ${UPF_E_N9_FILTER_CIDR:-}
      EDGE_DN_FILTER_CIDR: ${EDGE_DN_FILTER_CIDR:-}
      CENTRAL_DN_FILTER_CIDR: ${CENTRAL_DN_FILTER_CIDR:-}
      TRAFFIC_URL: ${TRAFFIC_URL:-}
      LATENCY_PROBE_SCOPE: ${LATENCY_PROBE_SCOPE:-auto}
      AGENT_ROLE: controller
      NODE_NAME: ${NODE_NAME:-upf-cn}
      LOCAL_UPF_CONTAINER: ${LOCAL_UPF_CONTAINER:-oai-upf}
      FLOW_CONTROLLER_URL: ${FLOW_CONTROLLER_URL:-http://192.168.0.1:9090}
      FLOW_DIRECT_PATH: ${FLOW_DIRECT_PATH:-/flow/all/direct}
      FLOW_CHAIN_PATH: ${FLOW_CHAIN_PATH:-/flow/all/chain}
      CENTRAL_DN_LATENCY_TARGET: ${CENTRAL_DN_LATENCY_TARGET:-}

  mec-agent-edge:
    <<: *agent-common
    container_name: mec-breakout-agent-edge
    profiles:
      - upf-e
    environment:
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://back-6gbricks.dedyn.io}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      N9_CIDR: ${N9_CIDR:-172.32.1.0/24}
      N6_CIDR: ${N6_CIDR:-172.31.1.0/24}
      N9_INTERFACE: ${N9_INTERFACE:-}
      N6_INTERFACE: ${N6_INTERFACE:-}
      COUNTER_BACKEND: ${COUNTER_BACKEND:-auto}
      UPF_E_N9_FILTER_CIDR: ${UPF_E_N9_FILTER_CIDR:-}
      EDGE_DN_FILTER_CIDR: ${EDGE_DN_FILTER_CIDR:-}
      CENTRAL_DN_FILTER_CIDR: ${CENTRAL_DN_FILTER_CIDR:-}
      TRAFFIC_URL: ${TRAFFIC_URL:-}
      LATENCY_PROBE_SCOPE: ${LATENCY_PROBE_SCOPE:-auto}
      AGENT_ROLE: telemetry
      NODE_NAME: ${NODE_NAME:-upf-e}
      LOCAL_UPF_CONTAINER: ${LOCAL_UPF_CONTAINER:-oai-upf-e}
      UPF_CN_N9_TARGET: ${UPF_CN_N9_TARGET:-}
      EDGE_DN_LATENCY_TARGET: ${EDGE_DN_LATENCY_TARGET:-}

  mec-validation-probe:
    build: .
    image: mec-breakout-agent:latest
    container_name: mec-validation-probe
    profiles:
      - validation
    restart: unless-stopped
    network_mode: "container:${VALIDATION_UPF_CONTAINER:-oai-upf-e}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "/agent/validation_probe.py"]
    environment:
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://back-6gbricks.dedyn.io}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      VALIDATION_ROLE: ${VALIDATION_ROLE:-upf-e}
      VALIDATION_UPF_CONTAINER: ${VALIDATION_UPF_CONTAINER:-oai-upf-e}
      VALIDATION_DIRECT_TARGET: ${VALIDATION_DIRECT_TARGET:-172.33.0.100}
      VALIDATION_CHAIN_TARGET: ${VALIDATION_CHAIN_TARGET:-172.32.0.134}
      VALIDATION_CENTRAL_TARGET: ${VALIDATION_CENTRAL_TARGET:-192.168.11.237}
      VALIDATION_PACKET_SIZE: ${VALIDATION_PACKET_SIZE:-1400}
      VALIDATION_INTERVAL_SECONDS: ${VALIDATION_INTERVAL_SECONDS:-0.01}
      VALIDATION_POLL_SECONDS: ${VALIDATION_POLL_SECONDS:-2}
      VALIDATION_N6_CONFIG_SECTION: ${VALIDATION_N6_CONFIG_SECTION:-n6}
      VALIDATION_N9_CONFIG_SECTION: ${VALIDATION_N9_CONFIG_SECTION:-n9}
      VALIDATION_EXPECTED_N6_INTERFACE: ${VALIDATION_EXPECTED_N6_INTERFACE:-eth0}
      VALIDATION_EXPECTED_N9_INTERFACE: ${VALIDATION_EXPECTED_N9_INTERFACE:-eth0}
